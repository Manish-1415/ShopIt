services:
  postgres-test:
    image : postgres:16-alpine
    container_name : test_postgres
    ports : 
      - "5434:5432"
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: mytesting_db

  postgres-db:
    image: postgres:16-alpine # Uses a lightweight, official Postgres 16 image
    container_name: local_postgres # The name that will show up in Docker Desktop
    ports:
      - "5433:5432" # Maps host port 5432 to container port 5432
    environment:
      POSTGRES_USER: myuser # Your database username
      POSTGRES_PASSWORD: mysecretpassword # Your database password
      POSTGRES_DB: mydevelopment_db # The default database name created on startup
    volumes:
      - postgres_data:/var/lib/postgresql/data # <--- THIS PERSISTS YOUR DATA

volumes:
  postgres_data: # Declares the safe, persistent volume
